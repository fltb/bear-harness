name: bear-harness-ci
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bear-harness-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
      - name: Install Linux confinement runtime
        id: linux_confinement
        shell: bash
        run: |
          set -o pipefail
          {
            sudo apt-get --option Acquire::Retries=3 update
            sudo apt-get --option Acquire::Retries=3 install --yes apparmor bubblewrap
            sudo install --owner=root --group=root --mode=0644 .github/apparmor/bear-harness-bwrap /etc/apparmor.d/bear-harness-bwrap
            sudo apparmor_parser --replace /etc/apparmor.d/bear-harness-bwrap
            bwrap --die-with-parent --new-session --unshare-all --share-net --ro-bind / / -- /bin/true
          } 2>&1 | tee linux-confinement.log
      - name: Publish Linux confinement setup failure
        if: failure() && steps.linux_confinement.outcome == 'failure'
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const focused = readFileSync("linux-confinement.log", "utf8").slice(-3_000);
          const encoded = focused
            .replaceAll("%", "%25")
            .replaceAll("\r", "%0D")
            .replaceAll("\n", "%0A");
          process.stdout.write(`::error title=Linux confinement setup failure::${encoded}\n`);
          NODE
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Host coverage
        id: host_coverage
        shell: bash
        run: |
          set -o pipefail
          npm run test:coverage --workspace @bear-harness/host-runtime 2>&1 | tee host-coverage.log
      - name: Publish Host coverage failure
        if: failure() && steps.host_coverage.outcome == 'failure'
        shell: bash
        run: |
          {
            echo "## Host coverage failure"
            echo
            echo '```text'
            tail -n 200 host-coverage.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const log = readFileSync("host-coverage.log", "utf8");
          const failureStart = log.lastIndexOf("Failed Tests");
          const focused = (failureStart < 0 ? log.slice(-3_000) : log.slice(failureStart)).slice(0, 3_000);
          const encoded = focused
            .replaceAll("%", "%25")
            .replaceAll("\r", "%0D")
            .replaceAll("\n", "%0A");
          process.stdout.write(`::error title=Host coverage failure::${encoded}\n`);
          NODE
      - name: Preserve Host coverage log
        if: always() && steps.host_coverage.outcome != 'skipped'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: host-coverage-log
          path: host-coverage.log
          if-no-files-found: error
      - name: Companion UI coverage
        run: npm run test:coverage --workspace @bear-harness/companion-ui
      - name: Desktop coverage
        run: npm run test:coverage --workspace @bear-harness/desktop
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error
      - run: npm run build
      - run: node scripts/release-attestation.mjs quality
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-attestation-quality
          path: release-attestations/quality.json
          if-no-files-found: error

  upstream-brand:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: node apps/desktop/scripts/check-upstream-brand.mjs

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm audit signatures

  recovery:
    needs: [quality]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: npm run build:packages
      - run: npm run test:release:recovery
      - run: node scripts/release-attestation.mjs recovery
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-attestation-recovery
          path: release-attestations/recovery.json
          if-no-files-found: error

  e2e:
    needs: [quality]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: npm run build:packages
      - run: npm run build
      - name: Install Electron runtime libraries
        run: |
          sudo apt-get --option Acquire::Retries=3 update
          sudo apt-get --option Acquire::Retries=3 install --yes libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libgtk-3-0 libgbm1 libasound2t64 libxss1 libxshmfence1 xvfb
      - run: xvfb-run -a npm run test:e2e:electron
      - run: node scripts/release-attestation.mjs electron-e2e
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-attestation-electron-e2e
          path: release-attestations/electron-e2e.json
          if-no-files-found: error

  web-e2e:
    needs: [quality]
    runs-on: ubuntu-24.04
    env:
      BEAR_E2E_PROFILE: hosted
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
      - name: Install Linux confinement runtime
        run: |
          sudo apt-get --option Acquire::Retries=3 update
          sudo apt-get --option Acquire::Retries=3 install --yes apparmor bubblewrap
          sudo install --owner=root --group=root --mode=0644 .github/apparmor/bear-harness-bwrap /etc/apparmor.d/bear-harness-bwrap
          sudo apparmor_parser --replace /etc/apparmor.d/bear-harness-bwrap
          bwrap --die-with-parent --new-session --unshare-all --share-net --ro-bind / / -- /bin/true
      - run: npm ci
      - run: npm run build:packages
      - run: npx --no-install playwright install --with-deps chromium
      - name: Run required Web E2E
        shell: bash
        run: |
          set -o pipefail
          npm run test:e2e:web:required 2>&1 | tee web-e2e.log
      - name: Publish Web E2E failure
        if: failure()
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const log = readFileSync("web-e2e.log", "utf8");
          const focused = log.slice(-5_000);
          const encoded = focused
            .replaceAll("%", "%25")
            .replaceAll("\r", "%0D")
            .replaceAll("\n", "%0A");
          process.stdout.write(`::error title=Web E2E failure::${encoded}\n`);
          NODE
      - name: Preserve Web E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: web-e2e-diagnostics
          path: |
            web-e2e.log
            test-results/web-dev/
          if-no-files-found: error
      - run: node scripts/release-attestation.mjs web-e2e
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-attestation-web-e2e
          path: release-attestations/web-e2e.json
          if-no-files-found: error

  package:
    needs: [quality, web-e2e, e2e]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            os-name: mac
            arch: x64
            package-cmd: package:mac:x64
            exts: dmg zip
            upload-glob: |
              apps/desktop/release/*.dmg
              apps/desktop/release/*.zip
          - os: macos-15
            os-name: mac
            arch: arm64
            package-cmd: package:mac:arm64
            exts: dmg zip
            upload-glob: |
              apps/desktop/release/*.dmg
              apps/desktop/release/*.zip
          - os: windows-2025
            os-name: win
            arch: x64
            package-cmd: package:win
            exts: exe zip
            upload-glob: |
              apps/desktop/release/*.exe
              apps/desktop/release/*.zip
          - os: ubuntu-24.04
            os-name: linux
            arch: x64
            package-cmd: package:linux
            exts: AppImage deb
            upload-glob: |
              apps/desktop/release/*.AppImage
              apps/desktop/release/*.deb
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: npm run build:packages
      - name: Build application
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee package-build.log
      - name: Publish package build failure
        if: failure()
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync } from "node:fs";
          if (existsSync("package-build.log")) {
            const encoded = readFileSync("package-build.log", "utf8")
              .slice(-5_000)
              .replaceAll("%", "%25")
              .replaceAll("\r", "%0D")
              .replaceAll("\n", "%0A");
            process.stdout.write(`::error title=Package build failure::${encoded}\n`);
          }
          NODE
      - name: Install Linux Electron runtime
        if: matrix.os-name == 'linux'
        run: |
          sudo apt-get --option Acquire::Retries=3 update
          sudo apt-get --option Acquire::Retries=3 install --yes libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libgtk-3-0 libgbm1 libasound2t64 libxss1 libxshmfence1 xvfb
      - name: Crashpad smoke (production config, temp root)
        shell: bash
        run: |
          set -o pipefail
          if [ "${{ matrix.os-name }}" = "linux" ]; then
            xvfb-run -a npm run test:diagnostics:crash
          else
            npm run test:diagnostics:crash
          fi 2>&1 | tee crashpad-smoke.log
      - name: Publish Crashpad smoke failure
        if: failure()
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync } from "node:fs";
          if (existsSync("crashpad-smoke.log")) {
            const encoded = readFileSync("crashpad-smoke.log", "utf8")
              .slice(-5_000)
              .replaceAll("%", "%25")
              .replaceAll("\r", "%0D")
              .replaceAll("\n", "%0A");
            process.stdout.write(`::error title=Crashpad smoke failure::${encoded}\n`);
          }
          NODE
      - name: Package
        shell: bash
        run: |
          set -o pipefail
          npm run ${{ matrix.package-cmd }} 2>&1 | tee package.log
      - name: Publish package failure
        if: failure()
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync } from "node:fs";
          if (existsSync("package.log")) {
            const encoded = readFileSync("package.log", "utf8")
              .slice(-3_000)
              .replaceAll("%", "%25")
              .replaceAll("\r", "%0D")
              .replaceAll("\n", "%0A");
            process.stdout.write(`::error title=Package failure::${encoded}\n`);
          }
          NODE
      - name: Generate package hashes and CycloneDX SBOM
        id: package_evidence
        shell: bash
        run: |
          set -o pipefail
          node scripts/verify-package.mjs ${{ matrix.os-name }} ${{ matrix.arch }} ${{ matrix.exts }} 2>&1 | tee package-evidence.log
      - name: Publish package evidence failure
        if: failure() && steps.package_evidence.outcome == 'failure'
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync } from "node:fs";
          if (existsSync("package-evidence.log")) {
            const encoded = readFileSync("package-evidence.log", "utf8")
              .slice(-3_000)
              .replaceAll("%", "%25")
              .replaceAll("\r", "%0D")
              .replaceAll("\n", "%0A");
            process.stdout.write(`::error title=Package evidence failure::${encoded}\n`);
          }
          NODE
      - name: Verify macOS target architecture
        if: matrix.os-name == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          APP=$(ls -d apps/desktop/release/mac*/*.app | head -1)
          EXE="$APP/Contents/MacOS/$(node --input-type=module -e "const { productConfig } = await import('@bear-harness/product-config'); process.stdout.write(productConfig.executableName)")"
          FRAMEWORK="$APP/Contents/Frameworks/Electron Framework.framework/Versions/A/Electron Framework"
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            lipo -archs "$EXE" | grep -qx "arm64"
            lipo -archs "$FRAMEWORK" | grep -qx "arm64"
          else
            lipo -archs "$EXE" | grep -qx "x86_64"
            lipo -archs "$FRAMEWORK" | grep -qx "x86_64"
          fi
      - name: Verify native llama binding
        shell: bash
        run: node apps/desktop/scripts/verify-native-bindings.mjs ${{ matrix.os-name }} ${{ matrix.arch }}
      - name: Verify Windows x64 PE machine
        if: matrix.os-name == 'win'
        run: node apps/desktop/scripts/verify-windows-pe.mjs
      - name: Verify bundled Windows Git runtime
        if: matrix.os-name == 'win'
        shell: pwsh
        run: node apps/desktop/scripts/verify-windows-runtime.mjs apps/desktop/release/win-unpacked/resources
      - name: Smoke bundled Windows Git executables
        if: matrix.os-name == 'win'
        shell: pwsh
        run: |
          & apps/desktop/release/win-unpacked/resources/git/usr/bin/bash.exe --version
          & apps/desktop/release/win-unpacked/resources/git/cmd/git.exe --version
      - name: Verify Linux x64 artifacts
        if: matrix.os-name == 'linux'
        run: node apps/desktop/scripts/verify-linux-artifacts.mjs
      - name: Packaged app smoke
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -o pipefail
          if [ "${{ matrix.os-name }}" = "linux" ]; then
            xvfb-run -a npm run test:e2e:packaged
          else
            npm run test:e2e:packaged
          fi 2>&1 | tee packaged-smoke.log
      - name: Publish packaged smoke failure
        if: failure()
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync } from "node:fs";
          if (existsSync("packaged-smoke.log")) {
            const encoded = readFileSync("packaged-smoke.log", "utf8")
              .slice(-12_000)
              .replaceAll("%", "%25")
              .replaceAll("\r", "%0D")
              .replaceAll("\n", "%0A");
            process.stdout.write(`::error title=Packaged smoke failure::${encoded}\n`);
          }
          NODE
      - name: Preserve packaged smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: packaged-smoke-diagnostics-${{ matrix.os-name }}-${{ matrix.arch }}
          path: |
            packaged-smoke.log
            test-results/
          if-no-files-found: warn
      - name: Attest packaged target
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.os-name }}-${{ matrix.arch }}
        run: node scripts/release-attestation.mjs package
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-attestation-package-${{ matrix.os-name }}-${{ matrix.arch }}
          path: |
            release-attestations/package-${{ matrix.os-name }}-${{ matrix.arch }}.json
            release-attestations/package-evidence-${{ matrix.os-name }}-${{ matrix.arch }}.json
            release-attestations/sbom-${{ matrix.os-name }}-${{ matrix.arch }}.cdx.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: bear-harness-${{ matrix.os-name }}-${{ matrix.arch }}
          path: ${{ matrix.upload-glob }}
          if-no-files-found: error

  release-gate:
    needs: [quality, upstream-brand, security, recovery, e2e, web-e2e, package]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
      - uses: actions/download-artifact@v7.0.1
        with:
          pattern: release-attestation-*
          path: release-attestations
          merge-multiple: true
      - run: node scripts/release-attestation.mjs final
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-attestation-final
          path: release-attestations/final.json
          if-no-files-found: error
