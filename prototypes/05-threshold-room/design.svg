      <text x="28" y="31" fill="#71817c" font-family="system-ui,sans-serif" font-size="11">极昼 · 第一个回应</text>
      <text x="28" y="70" fill="#273f3f" font-family="Georgia,'Songti SC',serif" font-size="23" font-weight="700">“这不是极光站。”</text>
      <text x="28" y="102" fill="#4f6661" font-family="system-ui,sans-serif" font-size="13">他看了一眼仍亮着的台灯，又看向门边的你。</text>
      <text x="28" y="134" fill="#273f3f" font-family="Georgia,'Songti SC',serif" font-size="20">“不过这里至少还有人在工作。门是你开的？”</text>
      <path d="M28 160h598" stroke="#ded7c8"/>
      <text x="28" y="188" fill="#536f68" font-family="system-ui,sans-serif" font-size="11" font-weight="700">重新生成</text>
      <text x="102" y="188" fill="#70827c" font-family="system-ui,sans-serif" font-size="11">生成后可 ‹ 1 / 2 › 切换</text>
      <text x="245" y="188" fill="#70827c" font-family="system-ui,sans-serif" font-size="11">继续</text>
      <text x="299" y="188" fill="#70827c" font-family="system-ui,sans-serif" font-size="11">记住这一刻</text>
      <text x="388" y="188" fill="#70827c" font-family="system-ui,sans-serif" font-size="11">这不像极昼…</text>
      <text x="486" y="188" fill="#70827c" font-family="system-ui,sans-serif" font-size="11">从这里另开一段</text>
    </g>
