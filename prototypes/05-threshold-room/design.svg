    <linearGradient id="scene" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17333b"/><stop offset=".52" stop-color="#21484a"/><stop offset="1" stop-color="#162a33"/></linearGradient>
    <radialGradient id="warm" cx="79%" cy="77%" r="42%"><stop stop-color="#dfbe82" stop-opacity=".56"/><stop offset=".46" stop-color="#b97e56" stop-opacity=".15"/><stop offset="1" stop-color="#172f37" stop-opacity="0"/></radialGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#98e1cc" stop-opacity="0"/><stop offset=".4" stop-color="#a9e6d3" stop-opacity=".72"/><stop offset=".72" stop-color="#73aeb9" stop-opacity=".36"/><stop offset="1" stop-color="#98e1cc" stop-opacity="0"/></linearGradient>
