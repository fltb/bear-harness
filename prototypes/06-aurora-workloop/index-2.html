function workCardHTML(type){const j=jobs[type],f=flow[type];if(j.state==='idle')return `<div class="msg work" data-work="${type}"><div class="msg-meta">系统行动确认 · 只有你能批准</div><div class="work-title">${f.title}</div><p class="work-intro">${f.intro}</p><div class="scope">${f.scope.map(x=>`<div class="${x[2]}"><strong>${x[0]}</strong><span>${x[1]}</span></div>`).join('')}</div><div class="warning">${f.warning}</div><div class="actions"><button data-action="preview" data-work="${type}">先看方案</button><button data-action="cancel" data-work="${type}">取消</button><button class="primary" data-action="approve" data-work="${type}">${f.approve}</button></div></div>`;if(j.state==='running')return `<div class="msg work" data-work="${type}"><div class="msg-meta">极昼 · 工作在后台</div><div class="work-head"><span class="pulse"></span><strong>${j.short} · ${j.progress}%</strong><button class="work-toggle" data-action="toggle" data-work="${type}">收起</button></div><div class="work-body"><p class="work-intro">你可以继续聊天或去别的对话；完成后结果会回到这里。</p><div class="work-progress"><div class="bar"><i style="width:${j.progress}%"></i></div></div></div></div>`;const badge=j.saved?"你已保存 · 仍可继续修改":"系统已确认 · 等你查看";const title=type==='report'?"项目进展报告 · 草稿":"照片整理结果";const undoBtn=type==='photos'?`<button class="danger" data-action="undo" data-work="${type}">撤销整理</button>`:'';return `<div class="msg work" data-work="${type}"><div class="msg-meta">极昼 · 把结果带回来</div><div class="work-head" data-action="open-panel" data-work="${type}"><strong>${title}</strong><span class="badge">${badge}</span><button class="work-toggle" data-action="toggle" data-work="${type}">收起</button></div><div class="work-body"><div class="preview">${type==='report'?reportHTML():photoHTML()}</div><div class="actions"><button class="primary" data-action="open" data-work="${type}">${type==='report'?'打开报告':'打开文件夹'}</button><button data-action="modify" data-work="${type}">继续修改</button><button data-action="save" data-work="${type}">保存到…</button><button data- function renderThread(){const conv=conversations[activeSessionId];const el=$("#thread");if(!conv||!el)return;let html='';let lastBear=-1;conv.messages.forEach((m,i)=>{if(m.role==='bear')lastBear=i});conv.messages.forEach((m,i)=>{if(m.role==='user'){html+=`<div class="msg user"><p>${esc(m.text)}</p></div>`}else if(m.role==='bear'){html+=`<div class="msg bear-msg"><div class="msg-meta">${esc(m.meta)}</div>${m.action?`<em>${esc(m.action)}</em>`:''}<p>${esc(m.speech)}</p></div>`;if(i===lastBear)html+=`<div class="msg-tools"><button data-action="regenerate">重新生成</button><button data-action="correct">这不像极昼</button><button data-action="branch">从这里另开一段</button></div>`}else if(m.role==='work'){html+=workCardHTML(m.type)}});el.innerHTML=html;scrollThread()}

function approve(type=pending){const j=jobs[type];if(!type||!j)return;closeResultPanel();const conv=conversations[activeSessionId];j.state='running';j.progress=18;j.source=`对话 · ${conv?.title||"雪停以后"}`;j.conversation=activeSessionId;j.pendingConv=null;pending=null;updateWork();const s=taskStory(type);story(...s);renderThread();scrollToWork(type);toast(type==='report'?"报告已在后台开始制作":"照片整理已在受限文件夹开始");timers.push(setTimeout(()=>{jobs[type].progress=62;updateWork();patchRunning(type)},900));timers.push(setTimeout(()=>{jobs[type].state='done';jobs[type].progress=100;updateWork();const s2=taskStory(type);bearTo(jobs[type].conversation,...s2);renderThread();scrollToWork(type);if(activeSessionId===jobs[type].conversation)openResultPanel(type);toast(type==='report'?"极昼把报告草稿带回来了":"照片已按月份整理，等待你查看")},1900))}

function relationshipTexts(){return {canon:['旧极光站的守望者','这份 Self Canon 随产品版本锁定；普通对话和现实工作都不能改写它。'],memory:[memoryEnabled?'关系记忆已开启':'关系记忆保持关闭',memoryEnabled?'只保存你明确确认的称呼、偏好与候选；不会把工作文件内容写进关系记忆。':'不保存称呼、偏好或共同经历；关闭不影响聊天与现实工作。'],history:['你们共同确认的片段',memoryEnabled?'门后的第一夜可由你确认后保存；你可以逐条查看、修改或忘掉。':'尚未保存长期共同经历；当前对话仍可正常继续。'],settings:['角色感 · 默认','称呼、关系、场景和角色表达在这里调整；设备、通知、数据与首次入场管理在“系统设置”。']}}function openDrawer(kind,type=current){$("#searchLayer").hidden=true;$("#drawer").hidden=false;const title={backstage:'幕后 · 高级详情',basis:'依据与操作记录',canon:'极昼是谁',memory:'熊记得的你',history:'共同经历',settings:'相处设定',relationship:'关系档案','system-settings':'系统设置'}[kind]||'幕后';$("#drawerTitle").textContent=title;if(kind==='backstage'||kind==='basis'){renderTechnical(type,kind);return}if(kind==='system-settings'){renderSystemSettings();return}const texts=relationshipTexts();if(kind==='relationship'){renderRelationship();return}const t=texts[kind];$("#drawerTabs").innerHTML='';$("#drawerContent").innerHTML=`<div class="detail-card"><strong>${t[0]}</strong><span>${t[1]}</span></div>${kind==='memory'?`<button class="secondary" id="toggleMemory" style="margin-top:10px">${memoryEnabled?'关闭关系记忆':'开启关系记忆'}</button>`:''}`;if(kind==='memory')$("#toggleMemory").onclick=()=>{memoryEnabled=!memoryEnabled;saveMemoryEnabled(memoryEnabled);openDrawer('memory');toast(memoryEnabled?'关系记忆已开启；新增仍会先问你':'关系记忆已关闭；工作功能不受影响')}}
function renderRelationship(active='canon'){const texts=relationshipTexts();{const tabs=[['canon','极昼是谁'],['memory','熊记得的你'],['history','共同经历'],['settings','相处设定']];$("#drawerTabs").innerHTML=tabs.map(([id,label])=>`<button class="${id===active?'active':''}" data-rel-tab="${id}" aria-pressed="${id===active}">${label}</button>`).join("");const [head,body]=texts[active];$("#drawerContent").innerHTML=`<div class="detail-card"><strong>${head}</strong><span>${body}</span></div>${active==='memory'?`<button class="secondary" id="toggleMemory" style="margin-top:10px">${memoryEnabled?'关闭关系记忆':'开启关系记忆'}</button>`:''}`;$$('[data-rel-tab]').forEach(b=>b.onclick=()=>renderRelationship(b.dataset.relTab));if(active==='memory')$("#toggleMemory").onclick=()=>{memoryEnabled=!memoryEnabled;saveMemoryEnabled(memoryEnabled);renderRelationship('memory');toast(memoryEnabled?'关系记忆已开启；新增仍会先问你':'关系记忆已关闭；工作功能不受影响')}}}
function renderSystemSettings(active="general"){const tabs=[["general","通用"],["privacy","隐私与数据"],["advanced","高级"]];$("#drawerTabs").innerHTML=tabs.map(([id,label])=>`<button class=\"${id===active?'active':''}\" data-settings-tab=\"${id}\" aria-pressed=\"${id===active}\">${label}</button>`).join("");const content={general:`<p>管理应用行为。角色称呼、关系和表达方式不在这里修改。</p><div class="detail-card"><strong>通知</strong><span>仅在做好了、需要你、没做成或目前无法确认时通知。</span></div><div class="detail-card"><strong>声音与辅助功能</strong><span>文字优先 · 动效跟随系统 · 不自动播放语音。</span></div><div class="detail-card"><strong>首次入场</strong><span>重新查看门后的第一夜。重播只重置向导临时进度；当前关系记忆许可保持不变，直到你在记忆许可步骤重新选择。</span><button class="quiet" id="replayIntroSetting" style="margin-top:9px;padding-left:0">重看首次入场</button></div>`,privacy:`<p>查看本机数据与记忆边界。</p><div class="detail-card"><strong>关系记忆</strong><span>当前${memoryEnabled?'已开启':'关闭'}；工作文件、权限和运行结果不会写入关系记忆。</span></div><div class="detail-card"><strong>工作记录与产物</strong><span>保存在本机。删除与导出属于完整产品能力，本页仅展示信息架构。</span></div>`,advanced:`<p>诊断与实现级选项。普通使用不需要进入这里。</p><div class="detail-card"><strong>运行详情</strong><span>Worker、模型、原始日志和版本信息位于单次工作的“幕后”详情。</span></div><div class="detail-card"><strong>静态原型</strong><span>所有任务、文件和设置变更均为本地界面演示，不执行真实操作。</span></div>`};$("#drawerContent").innerHTML=content[active];$$("[data-settings-tab]").forEach(button=>button.onclick=()=>renderSystemSettings(button.dataset.settingsTab));if(active==="general")$("#replayIntroSetting").onclick=()=>{$("#drawer").hidden=true;replayIntro()}}
function renderTechnical(type,kind){const task=jobs[type]||jobs.report;$("#drawerTabs").innerHTML='<button class="active">普通记录</button><button>技术详情</button><button>原始日志</button>';$("#drawerContent").innerHTML=`<p>默认只显示可理解的对象、实际改动和恢复能力。Worker、模型、哈希与原始日志放在这里，不占据角色场景。</p><div class="detail-card"><strong>这次允许的范围</strong><span>${type==='photos'?'只读写 下载/夏日照片；禁止删除、覆盖、联网与越界访问。':'只读 3 份已选会议材料；只写 文稿/星轨计划；禁止发送与修改原件。'}</span></div><div class="detail-card"><strong>当前事实</strong><span>${task.state==='done'?'运行已返回，系统已核对声明的产物与操作记录；仍由你决定是否采用。':task.state==='running'?'后台处理中；极昼仍可与你对话。':'尚未批准，没有发生现实行动。'}</span></div><div class="detail-card"><strong>恢复能力</strong><span>${type==='photos'?'记录 126 条 move/rename 映射，可生成反向操作。':'原始材料未改动；草稿可直接删除或另存。'}</span></div><div class="journal">HOST JOURNAL / LOCAL MOCK<br>source: ${task.source}<br>state: ${task.state}<br>worker context: relationship memory excluded<br>user approval ≠ run returned ≠ result adopted</div><button class="danger" id="stopJob">${task.state==='running'?'停下来':'清除本地演示记录'}</button>`;$("#stopJob").onclick=()=>{if(task.state==='running'){task.state='idle';task.progress=0;updateWork();setActive('home');toast('后台工作已停下；未把进行中结果当成完成')}else toast('静态原型不会删除真实文件')}}
function begin(type){pending=type;setActive(type)}
function replayIntro(){introStep=0;introName="";introRelation="";try{localStorage.removeItem(INTRO_SEEN_KEY)}catch{}$("#intro").hidden=false;renderIntro();toast("已打开首次入场；当前关系记忆许可保持不变")}
$("#introNext").onclick=()=>{if(introStep===1){introName=$("#introName").value.trim();if(!introName)return toast("先告诉极昼一个称呼，或选择跳过演示")}if(introStep===2&&!introRelation)return toast("选择一个相处起点；以后仍可改变");if(introStep===3)return finishIntro(true);introStep++;renderIntro()};
$("#introBack").onclick=()=>{if(introStep>0){if(introStep===1)introName=$("#introName")?.value.trim()||introName;introStep--;renderIntro()}};
$("#skipIntro").onclick=()=>{if(introStep===3)finishIntro(false);else{markIntroSeen();$("#intro").hidden=true;toast("已跳过首次入场；可在系统设置中重看")}};
$$('[data-view]').forEach(b=>b.onclick=()=>setActive(b.dataset.view));$$('[data-drawer]').forEach(b=>b.onclick=()=>openDrawer(b.dataset.drawer));
$("#newConversation").onclick=()=>createConversation();$("#dynamicConversationList").onclick=e=>{const del=e.target.closest("[data-del-id]");if(del){handleDeleteConversation(del);return}const button=e.target.closest("[data-session-id]");if(button)setActiveSession(button.dataset.sessionId)};
$("#searchButton").onclick=openSearch;$("#closeSearch").onclick=closeSearch;$("#searchInput").oninput=e=>renderSearch(e.target.value);
$("#quickReport").onclick=()=>begin('report');$("#quickPhotos").onclick=()=>begin('photos');
$("#workButton").onclick=$("#openQueue").onclick=()=>{$("#queuePop").hidden=!$("#queuePop").hidden;renderRuns()};$("#backstageButton").onclick=()=>openDrawer('backstage');$("#closeDrawer").onclick=()=>$("#drawer").hidden=true;
$("#send").onclick=()=>{const input=$("#chat"),text=input.value.trim();if(!text)return toast('先写一句想对极昼说的话');input.value='';if(/报告|会议/.test(text))return begin('report');if(/照片|月份|下载/.test(text))return begin('photos');const reply=Object.values(jobs).some(job=>job.state==='running')?'我听着。后台的事会自己跑，不需要你替程序守夜。':'继续说。我不会把这段对话的细节自动带进其他对话。';const session=conversations[activeSessionId];if(session){session.messages.push({role:"user",text});session.messages.push({role:"bear",meta:"极昼 · 此刻",action:`你说：“${text}” 极昼安静听完，把这一页和其他对话分开收好。`,speech:reply});session.empty=false;if(session.title==="新的对话"){session.title=text.length>14?`${text.slice(0,14)}…`:text;session.subtitle="刚刚 · 独立对话"}renderConversations();$("#sceneTitle").textContent=session.title;renderThread()}}
$("#attach").onclick=()=>toast('演示材料：3 份会议笔记 / 下载·夏日照片 文件夹');
$("#thread").onclick=e=>{const btn=e.target.closest("[data-action]");if(!btn)return;const type=btn.dataset.work,action=btn.dataset.action;if(action==='regenerate')return toast('只重写角色回应；不会改变权限、运行或结果');if(action==='correct')return toast('身份校正只影响角色表达，不改现实事实');if(action==='branch')return createConversation({branch:true});if(action==='approve')return approve(type);if(action==='cancel'){const conv=conversations[activeSessionId];const idx=conv.messages.findIndex(m=>m.role==='work'&&m.type===type);if(idx>-1)conv.messages.splice(idx,1);pending=null;jobs[type].pendingConv=null;renderThread();toast('已取消；没有读取、创建或移动任何内容');return}if(action==='preview')return toast(type==='photos'?'预览：将建立 3 个文件夹并移动 126 张；不删除':'预览：两种格式、一个保存位置；不改原文件');if(action==='open-panel'){openResultPanel(type);return}if(action==='toggle'){const card=btn.closest('.msg.work');const body=card.querySelector('.work-body');body.hidden=!body.hidden;const tgl=card.querySelector('.work-toggle');if(tgl)tgl.textContent=body.hidden?'展开':'收起';return}if(action==='open')return toast(type==='report'?'演示：打开 DOCX / PDF 产物':'演示：打开已整理的照片文件夹');if(action==='modify')return modifyJob(type);if(action==='save')return saveJob(type);if(action==='basis')return basisJob(type);if(action==='undo')return undoPhotos()};
$("#openResult").onclick=()=>toast(panelType==='report'?'演示：打开 DOCX / PDF 产物':'演示：打开已整理的照片文件夹');$("#modifyResult").onclick=()=>modifyJob(panelType);$("#saveResult").onclick=()=>saveJob(panelType);$("#basisResult").onclick=()=>basisJob(panelType);$("#undoResult").onclick=undoPhotos;
document.addEventListener('keydown',e=>{const target=e.target;if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch();return}if(e.key==='/'&&target.tagName!=='INPUT'&&target.tagName!=='TEXTAREA'){e.preventDefault();openSearch();return}if(e.key==='Escape'){if(!$("#searchLayer").hidden){closeSearch();$("#searchButton").focus();return}if(!$("#drawer").hidden){$("#drawer").hidden=true;return}if(!$("#resultSpace").hidden){closeResultPanel();return}$("#queuePop").hidden=true;}});if(!hasSeenIntro()){$("#intro").hidden=false;renderIntro()}renderThread();updateWork();
</script>
