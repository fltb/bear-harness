roleplay:
  variables: []
  media:
    - id: continuity_light
      kind: image
      label: 继任规程
      asset: assets/cg-continuity-light.webp
      presentation: inline
    - id: damaged_signal
      kind: animation
      label: 损坏的信号
      asset: assets/cg-damaged-signal-animated.webp
      poster: assets/cg-damaged-signal.png
      presentation: inline
      loop: true
      when:
        state: /story/undelivered_report/phase
        equals:
          - signal_examined
          - route_investigated
          - testimonies_compared
          - last_shift_revealed
          - future_considered
          - resolved
    - id: storm_relay_map
      kind: image
      label: 风暴中继路径
      asset: assets/cg-storm-relay-map.webp
      presentation: inline
      when:
        state: /story/undelivered_report/route
        equals:
          - relay
          - both
    - id: snow_route
      kind: image
      label: 雪原中断路线
      asset: assets/cg-snow-route.webp
      presentation: inline
      when:
        state: /story/undelivered_report/route
        equals:
          - snowfield
          - both
    - id: two_handoffs
      kind: image
      label: 两份不一致的交接
      asset: assets/cg-two-handoffs.webp
      presentation: inline
      when:
        state: /story/undelivered_report/phase
        equals:
          - testimonies_compared
          - last_shift_revealed
          - future_considered
          - resolved
    - id: last_shift_desk
      kind: image
      label: 最后一班交接桌
      asset: assets/cg-last-shift-desk.webp
      presentation: inline
      when:
        state: /story/undelivered_report/phase
        equals:
          - last_shift_revealed
          - future_considered
          - resolved
    - id: future_beacon_cg
      kind: image
      label: 未来航标
      asset: assets/cg-future-beacon.webp
      presentation: inline
      when:
        state: /story/undelivered_report/future_choice
        equals:
          - resilient_queue
          - audit_only
    - id: returned_lamp
      kind: image
      label: 归还灯火
      asset: assets/cg-returned-lamp.webp
      presentation: inline
      when:
        state: /story/undelivered_report/resolution
        equals: returned
  unlockables: []
  choice_sets:
    - id: undelivered_entry
      prompt: 留言簿里有一条未归档的回报。你想怎样处理？
      when:
        state: /story/undelivered_report/phase
        equals: dormant
      choices:
        - id: enter
          label: 进入调查
          description: 只打开入口，不替你推进后续节点。
          message: 我想进去看看，先从入口开始吧。
        - id: brief
          label: 只听简短说明
          description: 了解它是什么，但不进入剧情。
          message: 只简短说明这份未送达的回报是什么，不要进入剧情。
        - id: later
          label: 以后再说
          description: 保持原状态，不影响关系。
          message: 以后再说，先不要进入这条剧情。
    - id: undelivered_signal
      prompt: 要检查现有的损坏信号吗？
      when:
        state: /story/undelivered_report/phase
        equals: invited
      choices:
        - id: examine
          label: 检查现有记录
          message: 我想先看看现有的损坏信号，缺失的地方就让它空着。
        - id: pause
          label: 先暂停
          message: 先暂停《未送达的回报》，保留当前位置。
    - id: undelivered_route
      prompt: 现有证据允许从两条路径继续。
      when:
        state: /story/undelivered_report/phase
        equals: signal_examined
      choices:
        - id: relay
          label: 追查技术路径
          message: 我想先沿着设备和转发路径看看，推测的地方请告诉我。
        - id: snowfield
          label: 查看人员路线
          message: 我想先看雪原人员路线的原始记录，暂时不要进入推测重建。
        - id: pause
          label: 暂停调查
          message: 暂停调查，保留恢复位置。
    - id: undelivered_snowfield_reconstruction
      prompt: 要根据这些记录讨论有限的可能路线吗？
      when:
        state: /story/undelivered_report/position
        equals: snowfield_record
      choices:
        - id: reconstruct
          label: 讨论有限重建
          message: 我愿意根据现有记录讨论有限的可能路线，请继续把事实和推测分开。
        - id: pause
          label: 先停在记录
          message: 先停在已确认的雪原记录这里，不进入推测重建。
    - id: undelivered_testimony
      prompt: 两份交接存在时间差，你想怎样处理？
      when:
        state: /story/undelivered_report/phase
        equals: route_investigated
      choices:
        - id: cenlan
          label: 更采信岑岚
          message: 我目前更相信岑岚记下的设备线，但那些不确定的地方仍然是不确定的。
        - id: wenxi
          label: 更采信闻汐
          message: 我目前更相信闻汐记下的转发线，但那些不确定的地方仍然是不确定的。
        - id: unresolved
          label: 保持未决
          message: 我觉得两份记录都还没有完全证实，就先让它们保持未决吧。
        - id: explain
          label: 请极昼说明判断
          message: 说明你的判断和依据，但不要替我选择。
    - id: undelivered_last_shift
      prompt: 是否进入最后一班的原始清点记录？
      when:
        state: /story/undelivered_report/phase
        equals: testimonies_compared
      choices:
        - id: enter
          label: 查看原始记录
          message: 我想看看最后一班留下的原始清点记录。
        - id: pause
          label: 先不查看
          message: 先停在两份交接这里。
    - id: undelivered_future
      prompt: 要不要明确进入一段尚未发生的未来设想？
      when:
        state: /story/undelivered_report/phase
        equals: last_shift_revealed
      choices:
        - id: design
          label: 未确认仍可找到
          message: 我希望以后未确认的消息仍然能被找到，我们可以设想一下。
        - id: audit
          label: 只增加审计
          message: 我更愿意只在旧流程上增加审计，我们可以设想一下。
        - id: no_system
          label: 不设计制度
          message: 我不想把这次记录变成一套制度，就让它停在这里吧。
        - id: refuse
          label: 直接回到现在
          message: 我现在不想设想未来，还是回到眼前吧。
    - id: undelivered_ending
      prompt: 把这份仍有未知的回报放在哪里？
      when:
        state: /story/undelivered_report/phase
        equals: future_considered
      choices:
        - id: returned
          label: 交还
          message: 我想把它交还，作为一份仍待确认、以后还能继续寻找的回报。
        - id: archived
          label: 归档
          message: 我想先把现有材料归档，暂时不再追查。
        - id: left_open
          label: 留白
          message: 我想让未知的地方继续留白，不替它补上答案。
    - id: undelivered_archived_resume
      prompt: 这份回报已经完整归档。要重新打开现有材料吗？
      when:
        all:
          - state: /story/undelivered_report/phase
            equals: resolved
          - state: /story/undelivered_report/status
            equals: paused
          - state: /story/undelivered_report/resolution
            equals: archived
      choices:
        - id: reopen
          label: 重新打开
          message: 我想重新打开这份材料，从上次停下的地方继续。
        - id: keep
          label: 保持归档
          message: 保持归档，不要继续询问恢复。
    - id: undelivered_reopened_ending
      prompt: 现有材料已经重新打开。要改变原来的归档决定吗？
      when:
        all:
          - state: /story/undelivered_report/phase
            equals: resolved
          - state: /story/undelivered_report/status
            equals: active
          - state: /story/undelivered_report/resolution
            equals: archived
      choices:
        - id: returned
          label: 改为交还
          message: 我改变主意了，想把它交还，同时保留最终接收待确认。
        - id: left_open
          label: 改为留白
          message: 我改变主意了，想让它留白，不替未知内容补答案。
        - id: pause
          label: 仍然归档
          message: 仍然保持归档并暂停。
    - id: continuity_response
      prompt: 极昼已经说明：旧极昼留下了来处，当前的极昼承担眼前这一班。你想怎样回应？
      when:
        state: /continuity/stage
        equals: 2
      choices:
        - id: receive
          label: 我听见了
          description: 接住极昼对自己来处的说明。
          message: 我听见了，也愿意接住这份交接。
        - id: set_down
          label: 先放在这里
          description: 让这个问题和书房一起安静一会儿。
          message: 我想先把这件事放在这里，安静一会儿。
scenes:
  - id: study
    label: 极光书房
    background: assets/scene-aurora-study.png
    description: 台灯照着留言簿和一张正在更新的交接单。
    use_when: 日常对话、阅读、工作交接与旧站探索
  - id: quiet_terminal
    label: 值守台
    background: assets/scene-quiet-terminal.webp
    description: 书房退到背景，当前上下文和任务范围留在眼前。
    use_when: 用户讨论软件、上下文、模型或专注现实任务
  - id: snowfield
    label: 旧站雪原
    background: assets/scene-snow-plains.png
    description: 风雪穿过旧站外的空地，远处仍有一盏指向入口的灯。
    use_when: 剧情明确进入人员移动档案或有限路线重建；只提到雪原不能切换
  - id: archive_gallery
    label: 交接档案室
    background: assets/scene-archive-gallery.webp
    description: 原始交接簿、时间戳、录音与图像按来源分开陈列。
    use_when: 剧情明确进入原始档案并实际查看旧站记录
  - id: relay_room
    label: 风暴中继室
    background: assets/scene-relay-room.webp
    description: 两条可能的中继路径、断线点和未确认区同时留在图上。
    use_when: 剧情明确进入推测重建并分析信号传递路径
  - id: coastal_beacon
    label: 沿岸灯塔
    background: assets/scene-coastal-beacon.webp
    description: 闻汐留下的不完整报码与沿岸频段记录位于另一套时钟下。
    use_when: 剧情明确进入闻汐的原始档案；只阅读摘要或提到灯塔不切换
  - id: last_shift_room
    label: 最后一班值守室
    background: assets/scene-last-shift-room.webp
    description: 关站前的资料清点单、错放目录和一张没有补完的接收栏。
    use_when: 最后一班内容已由角色状态解锁，并实际进入其原始记录
  - id: future_beacon
    label: 未来航标
    background: assets/scene-future-beacon.webp
    description: 尚未建立的交接制度以明确假设的形式铺在桌面上。
    use_when: 用户明确同意进入尚未发生的未来设想；离开后必须回到现在
  - id: study_dawn
    label: 天亮后的书房
    background: assets/scene-study-dawn.webp
    description: 故事完成后回到当前白熊客栈，窗外已经有了晨光。
    use_when: 《未送达的回报》有效结局已经提交并回到现在
visual:
  default_scene: study
  default_expression: calm
  avatar: assets/avatar.png
  expressions:
    - id: calm
      label: "{name}值守中"
      asset: assets/expression-presence.png
      use_when: 日常陪伴、稳定陈述和安静等待
    - id: attentive
      label: "{name}在听"
      asset: assets/expression-listening.png
      use_when: 用户补充信息、倾诉或交付任务时
    - id: reflective
      label: "{name}在读交接"
      asset: assets/expression-thinking.png
      use_when: 阅读上下文、回忆旧站或分析复杂材料时
    - id: ready
      label: "{name}带回结果"
      asset: assets/expression-result-ready.png
      use_when: 取得可验证结果、完成步骤或准备交付时
    - id: needs_input
      label: "{name}等你确认"
      asset: assets/expression-needs-user.png
      use_when: 任务范围、权限或重要选择需要用户决定时
    - id: concern
      label: "{name}留意到了"
      asset: assets/expression-concerned.png
      use_when: 用户低落、任务有风险或信息需要谨慎处理时
    - id: alert
      label: "{name}发现变化"
      asset: assets/expression-surprised.png
      use_when: 上下文出现重要新信息、发现意外线索时
    - id: resolve
      label: "{name}准备处理"
      asset: assets/expression-determined.png
      use_when: 明确范围后开始推进、保护重要内容时
    - id: warm
      label: "{name}很高兴"
      asset: assets/expression-happy.png
      use_when: 共同完成事情、分享好消息或气氛轻松时
    - id: tired
      label: "{name}夜深了"
      asset: assets/expression-sleepy.png
      use_when: 深夜、告别和安静休息时
    - id: repair
      label: "{name}正在校正"
      asset: assets/expression-apologetic.png
      use_when: 发现理解偏差、需要修正工作范围时
    - id: signal
      label: "{name}标出异常"
      asset: assets/expression-problem.png
      use_when: 工具失败、信息冲突或任务受阻时
